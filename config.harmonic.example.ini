[exchange]
exchange = bybit
; Keys are read from env BYBIT_API_KEY / BYBIT_API_SECRET if set (preferred).
api_key =
api_secret =
testnet = true
; paper = simulate only (safe). live = send real orders to Bybit.
mode = paper
; swap = USDT perpetuals, spot = spot
market_type = swap
; optional proxy for all exchange calls (http/https/socks5).
; also picked up from env HARMONIC_PROXY / HTTPS_PROXY / HTTP_PROXY.
proxy =

[strategy]
; 啟用哪些策略(逗號分隔)。可用清單見: python -m harmonic strategies
strategies = harmonic

[scan]
quote = USDT
timeframes = 1h,4h
; top-N symbols by 24h quote volume; 0 = all USDT perps
max_symbols = 30
; explicit override, comma separated, e.g. BTC/USDT:USDT,ETH/USDT:USDT
symbols =
ohlcv_limit = 300
scan_interval_sec = 300

[detection]
zigzag_depth = 5
zigzag_deviation_pct = 0.5
ratio_tolerance = 0.06
min_quality = 0.4

[trade]
risk_per_trade = 1.0
; fixed contract size per trade; 0 = use risk model (risk_per_trade / |entry-stop|)
amount = 0
sl_buffer_pct = 0.5
; rmultiple = TPs at R multiples, cd_fib = TPs at CD-leg fib retracements
tp_mode = rmultiple
tp_r_multiples = 1.0,2.0,3.0
tp_partials = 0.4,0.3,0.3

[pending]
convert_to_market = true
pending_max_bars = 8
prz_breach_pct = 0.3

[service]
db_path = harmonic.db
web_host = 0.0.0.0
web_port = 8800
log_level = INFO
